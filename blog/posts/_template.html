<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在这里填写文章摘要">
  <meta name="robots" content="noindex">
  <title>文章标题 — Your Blog</title>
  <link rel="alternate" type="application/rss+xml" title="Your Blog RSS" href="../feed.xml">
  <link rel="stylesheet" href="../blog.css">
</head>
<body>
  <div class="shell post-shell">
    <header class="site-header">
      <a class="brand" href="../index.html"><strong>Your Blog</strong><span>你的博客名</span></a>
      <nav aria-label="博客导航">
        <a href="../../index.html">关于我</a>
        <a href="../index.html" aria-current="page">文章</a>
        <a class="rss" href="../feed.xml">RSS</a>
      </nav>
    </header>

    <main>
      <article>
        <header class="post-header">
          <a class="back-link" href="../index.html">← 返回全部文章</a>
          <h1>文章标题</h1>
          <p class="post-deck">一到两句摘要，说明这篇文章试图回答什么问题。</p>
          <div class="post-meta">
            <time datetime="YYYY-MM-DD">YYYY.MM.DD</time>
            <span>分类</span>
            <span>X min read</span>
          </div>
        </header>

        <div class="post-body">
          <p>正文开头。</p>

          <h2>小标题</h2>
          <p>正文内容。列表、引用块与文末附注的写法可参考 posts/post-elements-demo.html。</p>

          <aside class="note"><strong>附注说明（可选）：</strong>按实际情况说明 AI 参与方式、参考资料或后续更新；不需要时删除本段。</aside>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <span>© 2026 你的名字 / Your Name</span>
      <a href="../index.html">继续阅读 →</a>
    </footer>
  </div>
</body>
</html>

        <div class="post-body">
          <p>如题，Git Pull拉取失败，文件夹内没有变化。</p>

          <p>是因为暂存区有东西。</p>

          <h2>解决</h2>

          <p>放弃所有缓存：</p>

          <p><code>git reset HEAD .</code><br></p>

          <p>放弃掉所有还没有加入到缓存区（git add）的修改</p>

          <p><code>git checkout .</code></p>
